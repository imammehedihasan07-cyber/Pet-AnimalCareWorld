    <title>Pet & Animal Care World — Trusted Pet Care Guides & Veterinary Health</title>
    
    <!-- Meta Descriptions & Canonical -->
    <meta name="description" content="Explore trusted pet care guides, dog and cat health, nutrition tips, and veterinary information at Pet & Animal Care World. Available in English, বাংলা, and हिन्दी.">

    <!-- Automatic Language Routing Script -->
    <script>
        (function() {
            // 1. Check if user already saved a preferred language
            var savedLang = localStorage.getItem('petcare_lang');
            
            if (savedLang && ['en', 'bn', 'hi'].indexOf(savedLang) !== -1) {
                window.location.replace('./' + savedLang + '/');
                return;
            }

            // 2. Detect Browser Language
            var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            
            if (browserLang.indexOf('bn') !== -1) {
                window.location.replace('./bn/');
            } else if (browserLang.indexOf('hi') !== -1) {
                window.location.replace('./hi/');
            } else {
                window.location.replace('./en/'); // Default Fallback: English
            }
        })();
    </script>
</head>
<body>

    <!-- Fallback Landing UI for Browsers with Disabled JavaScript -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="./en/" class="brand-logo">
                🐾 Pet Care <span>World</span>
            </a>
        </div>
    </header>

    <main class="container" style="text-align: center; padding: 4rem 1.5rem;">
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">Select Your Language / আপনার ভাষা নির্বাচন করুন</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Welcome to Pet & Animal Care World. Please choose a language to continue:</p>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="./en/" style="background: var(--primary-color); color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600;">🇺🇸 English</a>
            <a href="./bn/" style="background: var(--primary-color); color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600;">🇧🇩 বাংলা</a>
            <a href="./hi/" style="background: var(--primary-color); color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600;">🇮🇳 हिन्दी</a>
        </div>
    </main>
